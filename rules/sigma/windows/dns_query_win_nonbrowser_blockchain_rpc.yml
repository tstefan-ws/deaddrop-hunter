title: Non-Browser Process DNS Query To Public Blockchain RPC Endpoint
id: e1cc1452-c065-4492-a87b-0eb5b86bed5f
status: experimental
description: |
    Detects a scripting engine, LOLBin or command-line downloader resolving the hostname of a
    public blockchain JSON-RPC endpoint. EtherHiding malware (ClearFake/UNC5142, DPRK UNC5342,
    stealth XMRig loaders) fetches its current C2 or configuration with a read-only eth_call to
    a smart contract via such endpoints. Browsers and wallets are excluded by the image list.
references:
    - https://www.linkedin.com/pulse/hunting-etherhiding-from-one-cluster-ecosystem-alex-necula-r7l8e/
    - https://cloud.google.com/blog/topics/threat-intelligence/dprk-adopts-etherhiding
    - https://attack.mitre.org/techniques/T1102/001/
author: deaddrop-hunter contributors
date: 2026-10-19
tags:
    - attack.command-and-control
    - attack.t1102.001
    - attack.t1071.001
logsource:
    product: windows
    category: dns_query
detection:
    selection_host:
        QueryName:
        - 'polygon-rpc.com'
        - '*.polygon-rpc.com'
        - 'rpc-mainnet.matic.network'
        - 'rpc-mainnet.maticvigil.com'
        - 'polygon-mainnet.public.blastapi.io'
        - 'rpc-amoy.polygon.technology'
        - '*.gateway.tenderly.co'
        - '*.publicnode.com'
        - '*.drpc.org'
        - 'rpc.ankr.com'
        - '1rpc.io'
        - '*.quiknode.pro'
        - '*.llamarpc.com'
        - 'cloudflare-eth.com'
        - '*.infura.io'
        - '*.g.alchemy.com'
        - '*.nodereal.io'
        - '*.blastapi.io'
        - 'rpc.flashbots.net'
        - '*.blockpi.network'
        - 'bsc-dataseed*.binance.org'
        - 'bsc-dataseed*.bnbchain.org'
        - 'bsc-dataseed*.defibit.io'
        - 'bsc-dataseed*.ninicoin.io'
        - 'data-seed-prebsc-*.bnbchain.org'
        - 'data-seed-prebsc-*.binance.org'
        - 'bsc-testnet.bnbchain.org'
        - 'bsc.drpc.org'
        - 'api.trongrid.io'
        - 'api.shasta.trongrid.io'
        - 'api.mainnet-beta.solana.com'
        - 'fullnode.mainnet.aptoslabs.com'
        - 'mainnet.base.org'
        - 'api.avax.network'
    selection_img:
        Image|endswith:
        - '\curl.exe'
        - '\wget.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
        - '\powershell_ise.exe'
        - '\mshta.exe'
        - '\wscript.exe'
        - '\cscript.exe'
        - '\rundll32.exe'
        - '\regsvr32.exe'
        - '\python.exe'
        - '\pythonw.exe'
        - '\node.exe'
        - '\bash.exe'
        - '\sh.exe'
        - '\cmd.exe'
        - '\certutil.exe'
        - '\bitsadmin.exe'
        - '\msiexec.exe'
    condition: all of selection_*
falsepositives:
    - Developers and CI jobs using curl, node, python or PowerShell against public RPC endpoints
    - Crypto wallets, trading bots and dApp tooling implemented as scripts
    - Blockchain monitoring / threat-hunting tools (including deaddrop-hunter itself)
level: medium
