name: deploy-pages

# Builds the static dashboard (web/ + data/ + exported feeds) and deploys it to
# GitHub Pages. Runs on its own when the dashboard or site builder changes on the
# default branch, and is called by hunt.yml after every scheduled hunt.
# Repository settings: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - "src/deaddrop_hunter/exporters/**"
      - ".github/workflows/deploy-pages.yml"
  # A hunt run lasts hours and pushes its findings as it goes, so the site cannot wait for
  # the run to end to be rebuilt. This publishes whatever is in the repo, once an hour.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref; hunt.yml passes the branch so the fresh data commit is included)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export feeds
        run: |
          mkdir -p data site/feeds
          deaddrop-hunter export --data data --out site/feeds --formats stix,misp,csv,txt,api

      - name: Build site
        run: python scripts/build_site.py --out site --web web --data data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One Pages deployment at a time; never cancel one that is in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
