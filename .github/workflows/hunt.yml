name: hunt

# Scheduled sweep: run the hunter, commit changed data/ back to the branch,
# then rebuild and deploy the GitHub Pages dashboard (reusable deploy-pages.yml).

on:
  schedule:
    # Hourly, but a run lasts 5.5 hours: GitHub's job limit is 6. The concurrency group below
    # keeps exactly one running, so the hourly trigger is really "restart within the hour if
    # the chain ever breaks" rather than "start another one". Measured 2026-10-19: a */15
    # schedule produced one run in six hours, so relying on the trigger alone reads ~6% of
    # blocks; relying on a long run instead makes a dropped trigger cost minutes, not hours.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated chain keys from config/hunts.toml (empty = all)"
        required: false
        default: ""
        type: string
      days:
        description: "Look-back window in days for chains without a cursor (empty = config default)"
        required: false
        default: ""
        type: string
      hunts:
        description: "Comma-separated hunt ids (empty = all)"
        required: false
        default: ""
        type: string
      loop_minutes:
        description: "Keep hunting for this many minutes (0 = a single pass)"
        required: false
        default: "330"
        type: string
      gap_seconds:
        description: "Seconds between cycles inside a run"
        required: false
        default: "300"
        type: string

# Never run two hunts at once: they would race on data/ and the git push.
concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run hunt
        env:
          # All optional. Unset secrets resolve to empty strings; the hunter skips
          # providers whose key is missing.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          DDH_RPC_BSC: ${{ secrets.DDH_RPC_BSC }}
          DDH_RPC_BSC_TESTNET: ${{ secrets.DDH_RPC_BSC_TESTNET }}
          DDH_RPC_SOLANA: ${{ secrets.DDH_RPC_SOLANA }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          INPUT_CHAINS: ${{ inputs.chains }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_HUNTS: ${{ inputs.hunts }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '330' }}
          GAP_SECONDS: ${{ inputs.gap_seconds || '300' }}
        id: commit
        run: |
          # Drop empty variables so the CLI sees "unset" rather than "".
          for v in ETHERSCAN_API_KEY DUNE_API_KEY TRONGRID_API_KEY DDH_RPC_BSC DDH_RPC_BSC_TESTNET DDH_RPC_SOLANA VT_API_KEY; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=(--config config/hunts.toml --data data)
          if [ -n "$INPUT_CHAINS" ]; then args+=(--chains "$INPUT_CHAINS"); fi
          if [ -n "$INPUT_DAYS" ];   then args+=(--days "$INPUT_DAYS"); fi
          if [ -n "$INPUT_HUNTS" ];  then args+=(--hunts "$INPUT_HUNTS"); fi
          # One run covers its whole hour. The block watcher reads a fixed window of blocks
          # per cycle, so cycling every few minutes is what keeps it level with the chain;
          # waiting for the next scheduled run would leave gaps nothing ever reads.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          committed=0
          # A run lasts hours, so findings are pushed as they are found rather than at the
          # end. Cursors move every cycle, so a cursor-only change waits until the last
          # heartbeat is an hour old; anything else goes out immediately.
          publish_data() {
            git add -A data/
            if git diff --cached --quiet; then return 0; fi
            if git diff --cached --quiet -- data/ ':(exclude)data/meta.json'; then
              last=$(git log -1 --format=%ct -- data/meta.json 2>/dev/null || echo 0)
              if [ $(( $(date -u +%s) - ${last:-0} )) -lt 3300 ]; then
                git reset -q
                return 0
              fi
            fi
            git commit -q -m "data: hunt $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
                committed=$((committed + 1))
                echo "cycle $1: pushed"
                return 0
              fi
              echo "cycle $1: push rejected, rebasing (attempt $i)"
              git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            done
            echo "::warning::cycle $1: could not push"
          }
          deadline=$(( SECONDS + 60 * ${LOOP_MINUTES:-330} ))
          cycle=0
          while :; do
            cycle=$((cycle + 1))
            echo "::group::cycle $cycle  deaddrop-hunter hunt ${args[*]}"
            # A cycle can fail on a rate-limited endpoint; the next one resumes from the
            # stored position, so a failure must not end the run.
            deaddrop-hunter hunt "${args[@]}" || echo "::warning::cycle $cycle failed"
            echo "::endgroup::"
            publish_data "$cycle"
            [ "${LOOP_MINUTES:-330}" -gt 0 ] || break
            [ "$SECONDS" -lt "$deadline" ] || break
            sleep "${GAP_SECONDS:-300}"
          done
          echo "ran $cycle cycle(s); committed $committed time(s)"
          echo "changed=$([ "$committed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"


  deploy:
    needs: hunt
    # Only when the hunt actually committed something: at a 15-minute cadence an
    # unconditional deploy would rebuild the site 96 times a day for nothing. Dashboard
    # changes deploy through deploy-pages.yml's own push trigger on web/**.
    if: ${{ !cancelled() && needs.hunt.outputs.changed == 'true' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ github.ref }}
