name: hunt

# Scheduled sweep: run the hunter, commit changed data/ back to the branch,
# then rebuild and deploy the GitHub Pages dashboard (reusable deploy-pages.yml).

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the top of the hour
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated chain keys from config/hunts.toml (empty = all)"
        required: false
        default: ""
        type: string
      days:
        description: "Look-back window in days for chains without a cursor (empty = config default)"
        required: false
        default: ""
        type: string
      hunts:
        description: "Comma-separated hunt ids (empty = all)"
        required: false
        default: ""
        type: string

# Never run two hunts at once: they would race on data/ and the git push.
concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run hunt
        env:
          # All optional. Unset secrets resolve to empty strings; the hunter skips
          # providers whose key is missing.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          DDH_RPC_BSC: ${{ secrets.DDH_RPC_BSC }}
          DDH_RPC_BSC_TESTNET: ${{ secrets.DDH_RPC_BSC_TESTNET }}
          DDH_RPC_SOLANA: ${{ secrets.DDH_RPC_SOLANA }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          INPUT_CHAINS: ${{ inputs.chains }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_HUNTS: ${{ inputs.hunts }}
        run: |
          # Drop empty variables so the CLI sees "unset" rather than "".
          for v in ETHERSCAN_API_KEY DUNE_API_KEY TRONGRID_API_KEY DDH_RPC_BSC DDH_RPC_BSC_TESTNET DDH_RPC_SOLANA VT_API_KEY; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=(--config config/hunts.toml --data data)
          if [ -n "$INPUT_CHAINS" ]; then args+=(--chains "$INPUT_CHAINS"); fi
          if [ -n "$INPUT_DAYS" ];   then args+=(--days "$INPUT_DAYS"); fi
          if [ -n "$INPUT_HUNTS" ];  then args+=(--hunts "$INPUT_HUNTS"); fi
          echo "deaddrop-hunter hunt ${args[*]}"
          deaddrop-hunter hunt "${args[@]}"

      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: hunt $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry the push in case someone pushed to the branch meanwhile.
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push data commit"
          exit 1

  deploy:
    needs: hunt
    # Deploy even when nothing changed (keeps the site fresh after web/ edits),
    # but only from the default branch.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ github.ref }}
