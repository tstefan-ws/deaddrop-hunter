[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deaddrop-hunter"
version = "0.1.0"
description = "Hunt malware dead drops (EtherHiding C2/config) stored on public blockchains."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["threat-hunting", "etherhiding", "blockchain", "malware", "ioc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
opencti = ["pycti"]

[project.scripts]
deaddrop-hunter = "deaddrop_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
